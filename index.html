<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPO Mitra Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#111827}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;padding:16px;border-radius:14px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #d0d5dd;border-radius:9px}button{padding:11px 15px;border:0;border-radius:9px;margin:4px;cursor:pointer}.save{background:#111827;color:#fff}.del{background:#fee2e2;color:#b42318}.add{background:#e5e7eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.small{color:#667085;font-size:13px}.ok{color:#087443}.err{color:#b42318}</style></head><body><div class="wrap"><h1>IPO Mitra – Admin</h1><p class="small">Live content editor. Changes are saved to your IPO Mitra API.</p><div class="card"><label>API URL</label><input id="api" value="https://ipo-mitra-api.onrender.com"><label>Admin Token</label><input id="tok" type="password" autocomplete="off" placeholder="Enter your Render ADMIN_TOKEN"><button onclick="load()">LOAD CURRENT CONTENT</button><button onclick="testToken()">TEST ADMIN TOKEN</button></div><div class="card"><h2>App Content</h2><div id="content"></div></div><div class="card"><h2>IPOs</h2><div id="ipos"></div><button class="add" onclick="addI()">+ Add IPO</button></div><div class="card"><h2>Learn Topics</h2><div id="learn"></div><button class="add" onclick="addL()">+ Add Topic</button></div><button class="save" onclick="save()">SAVE ALL CHANGES</button><p id="msg"></p></div><script>
let db={content:{},ipos:[],learn:[]};const cf=[["appTitle","App Name"],["tagline","Tagline"],["homeMessage","Home Message"],["disclaimer","Disclaimer"],["footer","Footer"]];const fields=[["name","IPO Name"],["price","Price Band"],["dates","Open / Close Date"],["lot","Lot Size"],["gmp","GMP"],["risk","Risk"],["positive","Positive Factors"],["watch","Watch Points"]];function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function render(){content.innerHTML=cf.map(x=>`<label>${x[1]}</label><textarea data-c="${x[0]}">${esc(db.content?.[x[0]])}</textarea>`).join("");ipos.innerHTML=(db.ipos||[]).map((x,i)=>`<div class="card"><b>IPO #${i+1}</b><div class="grid">${fields.map(f=>`<div><label>${f[1]}</label><input data-i="${i}" data-k="${f[0]}" value="${esc(x[f[0]])}"></div>`).join("")}</div><button class="del" onclick="remI(${i})">Delete IPO</button></div>`).join("");learn.innerHTML=(db.learn||[]).map((x,i)=>`<div class="card"><label>Title</label><input data-l="${i}" data-k="title" value="${esc(x.title)}"><label>Content</label><textarea data-l="${i}" data-k="text">${esc(x.text)}</textarea><button class="del" onclick="remL(${i})">Delete Topic</button></div>`).join("")}function collect(){document.querySelectorAll("[data-c]").forEach(e=>db.content[e.dataset.c]=e.value);document.querySelectorAll("[data-i]").forEach(e=>db.ipos[+e.dataset.i][e.dataset.k]=e.value);document.querySelectorAll("[data-l]").forEach(e=>db.learn[+e.dataset.l][e.dataset.k]=e.value)}function token(){return String(tok.value||"").trim()}async function load(){msg.className="";msg.textContent="Loading...";try{let r=await fetch(api.value.trim()+"/api/content");if(!r.ok)throw Error("HTTP "+r.status);db=await r.json();render();msg.className="ok";msg.textContent="Current content loaded."}catch(e){msg.className="err";msg.textContent="Load failed: "+e.message}}async function testToken(){msg.className="";msg.textContent="Checking token...";try{let t=token(),r=await fetch(api.value.trim()+"/api/auth-test",{headers:{Authorization:"Bearer "+t,"X-Admin-Token":t}}),j=await r.json();if(!r.ok)throw Error(j.error||("HTTP "+r.status));msg.className="ok";msg.textContent="Admin token verified successfully."}catch(e){msg.className="err";msg.textContent="Token test failed: "+e.message}}async function save(){collect();msg.className="";msg.textContent="Saving...";try{let t=token(),r=await fetch(api.value.trim()+"/api/content",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t,"X-Admin-Token":t},body:JSON.stringify(db)}),j=await r.json();if(!r.ok)throw Error(j.error||("HTTP "+r.status));msg.className="ok";msg.textContent="Saved successfully."}catch(e){msg.className="err";msg.textContent="Save failed: "+e.message}}function addI(){collect();db.ipos.push({id:String(Date.now()),name:"New IPO",price:"",dates:"",lot:"",gmp:"",risk:"Medium",positive:"",watch:""});render()}function remI(i){collect();db.ipos.splice(i,1);render()}function addL(){collect();db.learn.push({id:String(Date.now()),title:"New Topic",text:""});render()}function remL(i){collect();db.learn.splice(i,1);render()}render();</script></body></html>
